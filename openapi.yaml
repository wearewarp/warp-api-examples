  /multistop/quote:
    post:
      summary: Quote an FTL multi-stop shipment
      operationId: multistopQuote
      tags:
      - Multi-stop
      security:
      - bearerAuth: []
      description: One truck, one route, multiple stops. The route model is first pickup (pickup_info) → intermediate stops
        (transits, in order) → final delivery (delivery_info). snake_case keys shown here are translated to the gateway's
        camelCase (/freights/quote/multi-stops); camelCase equivalents are also accepted. Set vehicle_type to get a priced
        quote — without it the gateway answers "A rate has not yet been determined for this route".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pickup_date
              - pickup_info
              - transits
              - delivery_info
              - list_items
              properties:
                pickup_date:
                  type: string
                  format: date
                  example: '2026-06-22'
                pickup_info:
                  type: object
                  required:
                  - zipcode
                  description: First pickup stop.
                  properties:
                    zipcode:
                      type: string
                      example: '90001'
                transits:
                  type: array
                  minItems: 1
                  description: Intermediate stops between first pickup and final delivery, in route order.
                  items:
                    type: object
                    required:
                    - zipcode
                    properties:
                      zipcode:
                        type: string
                        example: '92101'
                delivery_info:
                  type: object
                  required:
                  - zipcode
                  description: Final delivery stop.
                  properties:
                    zipcode:
                      type: string
                      example: '85001'
                list_items:
                  type: array
                  items:
                    type: object
                    description: Freight item. Same field set the single-stop gateway quote uses; send dims in inches (size_unit
                      IN) and weight in lbs.
                    properties:
                      name:
                        type: string
                        example: '1'
                      length:
                        type: number
                        example: 48
                      width:
                        type: number
                        example: 40
                      height:
                        type: number
                        example: 48
                      size_unit:
                        type: string
                        example: IN
                      total_weight:
                        type: number
                        example: 5000
                        description: Total weight across the quantity, not per piece
                      weight_unit:
                        type: string
                        example: lbs
                      quantity:
                        type: integer
                        example: 10
                      packaging:
                        type: string
                        example: pallet
                      stackable:
                        type: boolean
                        example: false
                vehicle_type:
                  type: string
                  example: DRY_VAN_53
                  description: Vehicle code. Optional to the validator but required in practice to resolve a rate.
                shipment_type:
                  type: string
                  example: FTL
      responses:
        '200':
          description: Multi-stop quote returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote_id:
                    type: string
                    example: PRICING_MULTI_df23163d-2ad1-40c2-94a0-24bf2919a13c
                  total_charge:
                    type: number
                    example: 2281.81
                  transit_time:
                    type: integer
                    example: 39600
                    description: Seconds
                  rate_detail:
                    type: object
        '400':
          description: 'Validation failure (gateway message passed through as { error, code: UPSTREAM_ERROR, upstream_status,
            upstream_response })'
        '401':
          description: Auth failure
        '502':
          description: Upstream error
  /multistop/book:
    post:
      summary: Book a quoted multi-stop FTL shipment
      operationId: multistopBook
      tags:
      - Multi-stop
      security:
      - bearerAuth: []
      description: 'Books the route quoted by /multistop/quote as per-leg shipments: one entry per pickup→delivery pair, each
        referencing the quoted stop sequence by stop_index. snake_case keys are translated to the gateway''s camelCase (/freights/booking/multi-stops);
        camelCase equivalents are also accepted. No Stripe charge fires here — multi-stop pricing settles via your Warp account.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quote_id
              - shipments
              properties:
                quote_id:
                  type: string
                  example: PRICING_MULTI_df23163d-2ad1-40c2-94a0-24bf2919a13c
                  description: From /multistop/quote
                shipments:
                  type: array
                  minItems: 2
                  description: One leg per pickup→delivery pair riding the quoted route.
                  items:
                    type: object
                    required:
                    - pickup_info
                    - delivery_info
                    - list_items
                    properties:
                      pickup_info:
                        type: object
                        required:
                        - stop_index
                        - address
                        - window_time
                        properties:
                          stop_index:
                            type: integer
                            description: 'Index into the quoted stop sequence: 0 = the quote''s pickup_info stop, then transits
                              in order, last = the quote''s delivery_info stop.'
                          address:
                            type: object
                            required:
                            - zipcode
                            properties:
                              street:
                                type: string
                              city:
                                type: string
                              state:
                                type: string
                              zipcode:
                                type: string
                                description: Exact field name the gateway validates; zip/zip_code/zipCode are normalized to
                                  it
                          window_time:
                            type: object
                            required:
                            - from
                            - to
                            properties:
                              from:
                                type: string
                                format: date-time
                                example: '2026-06-22T08:00:00.000Z'
                              to:
                                type: string
                                format: date-time
                                example: '2026-06-22T23:59:59.000Z'
                          contact_name:
                            type: string
                          contact_phone:
                            type: string
                          contact_email:
                            type: string
                      delivery_info:
                        type: object
                        required:
                        - stop_index
                        - address
                        - window_time
                        properties:
                          stop_index:
                            type: integer
                            description: 'Index into the quoted stop sequence: 0 = the quote''s pickup_info stop, then transits
                              in order, last = the quote''s delivery_info stop.'
                          address:
                            type: object
                            required:
                            - zipcode
                            properties:
                              street:
                                type: string
                              city:
                                type: string
                              state:
                                type: string
                              zipcode:
                                type: string
                                description: Exact field name the gateway validates; zip/zip_code/zipCode are normalized to
                                  it
                          window_time:
                            type: object
                            required:
                            - from
                            - to
                            properties:
                              from:
                                type: string
                                format: date-time
                                example: '2026-06-22T08:00:00.000Z'
                              to:
                                type: string
                                format: date-time
                                example: '2026-06-22T23:59:59.000Z'
                          contact_name:
                            type: string
                          contact_phone:
                            type: string
                          contact_email:
                            type: string
                      list_items:
                        type: array
                        items:
                          type: object
                          description: Freight item. Same field set the single-stop gateway quote uses; send dims in inches
                            (size_unit IN) and weight in lbs.
                          properties:
                            name:
                              type: string
                              example: '1'
                            length:
                              type: number
                              example: 48
                            width:
                              type: number
                              example: 40
                            height:
                              type: number
                              example: 48
                            size_unit:
                              type: string
                              example: IN
                            total_weight:
                              type: number
                              example: 5000
                              description: Total weight across the quantity, not per piece
                            weight_unit:
                              type: string
                              example: lbs
                            quantity:
                              type: integer
                              example: 10
                            packaging:
                              type: string
                              example: pallet
                            stackable:
                              type: boolean
                              example: false
                        description: Items riding this leg
      responses:
        '200':
          description: Multi-stop booking confirmed (gateway response returned verbatim)
        '400':
          description: 'Validation failure (gateway message passed through as { error, code: UPSTREAM_ERROR, upstream_status,
            upstream_response })'
        '401':
          description: Auth failure
        '502':
          description: Upstream error
  /tools/freight-class:
    post:
      summary: Calculate NMFTA density-based LTL freight class
      operationId: freightClassCalc
      tags:
      - Tools
      description: Public free utility. No auth required for first 60 req/hr per IP. wak_test_* keys get 1,000/hr; wak_live_*
        keys get 10,000/hr. CORS open. Returns data + meta envelope with rate-limit, docs, upgrade URL, and attribution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - length
              - width
              - height
              - weight
              properties:
                length:
                  type: number
                  example: 48
                  description: Length (default inches; use units=cm for centimeters)
                width:
                  type: number
                  example: 40
                  description: Width (default inches)
                height:
                  type: number
                  example: 48
                  description: Height (default inches)
                weight:
                  type: number
                  example: 500
                  description: Total weight (default pounds; use weight_unit=kg for kilograms)
                units:
                  type: string
                  enum:
                  - in
                  - cm
                  description: Defaults to in
                weight_unit:
                  type: string
                  enum:
                  - lb
                  - kg
                  description: Defaults to lb
      responses:
        '200':
          description: Computed freight class with rate-limit meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      freight_class:
                        type: string
                        example: '100'
                      density_pcf:
                        type: number
                        example: 9.42
                      cubic_feet:
                        type: number
                        example: 53.33
                      class_band:
                        type: string
                        example: Standard
                      note:
                        type: string
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                      tier:
                        type: string
                        enum:
                        - anon
                        - sandbox
                        - live
                      rate_limit:
                        type: object
                        properties:
                          limit:
                            type: integer
                          remaining:
                            type: integer
                          reset_at:
                            type: string
                            format: date-time
                      docs:
                        type: string
                      upgrade:
                        type: string
                      attribution:
                        type: string
        '400':
          description: BAD_INPUT — missing/invalid dimensions or weight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: RATE_LIMITED — tier limit reached; meta.upgrade points to the next tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Calculate NMFTA freight class via query params
      operationId: freightClassCalcGet
      tags:
      - Tools
      description: Convenience GET. Same response shape as POST.
      parameters:
      - name: length
        in: query
        required: true
        schema:
          type: number
        example: 48
      - name: width
        in: query
        required: true
        schema:
          type: number
        example: 40
      - name: height
        in: query
        required: true
        schema:
          type: number
        example: 48
      - name: weight
        in: query
        required: true
        schema:
          type: number
        example: 500
      - name: units
        in: query
        required: false
        schema:
          type: string
          enum:
          - in
          - cm
      - name: weight_unit
        in: query
        required: false
        schema:
          type: string
          enum:
          - lb
          - kg
      responses:
        '200':
          description: Computed freight class
        '400':
          description: BAD_INPUT
        '429':
          description: RATE_LIMITED
